name: Build Theos Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Theos
        uses: theos/setup-theos@main

      - name: Build Package
        run: |
          make package FINALPACKAGE=1

      - name: Upload Dylib & Deb Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: ModMenu-Build
          path: |
            .theos/obj/debug/*.dylib
            packages/*.deb
            *.deb
